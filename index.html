<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Keightley - Professional Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- M3 Expressive Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="antialiased selection:bg-m3-primary selection:text-white bg-m3-surface">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- M3 HERO / PROFILE SECTION -->
    <section id="home" class="relative min-h-[90vh] flex flex-col items-center justify-center px-4 pt-12 pb-24">
        <!-- Profile Data Injected Here -->
        <div id="profile-container" class="w-full max-w-md relative z-10 text-center"></div>

        <a href="#experience" class="absolute bottom-8 z-10 flex flex-col items-center text-slate-500 hover:text-m3-primary transition-colors">
            <i class="fa-solid fa-arrow-down animate-bounce bg-m3-surface-container-high w-10 h-10 rounded-full flex items-center justify-center" style="display: flex;"></i>
        </a>
    </section>

    <main id="portfolio" class="bg-m3-surface">
        
        <!-- EXPERIENCE SECTION -->
        <section id="experience" class="py-24 px-6">
            <div class="max-w-4xl mx-auto">
                <div class="mb-12">
                    <h2 class="text-sm font-bold text-m3-primary uppercase tracking-widest mb-2">Career History</h2>
                    <h3 class="text-4xl font-extrabold tracking-tight">Professional Experience</h3>
                </div>
                <div id="experience-container" class="space-y-6"></div>
            </div>
        </section>

        <!-- PUBLICATIONS SECTION -->
        <section id="publications" class="py-24 px-6 bg-m3-surface-container rounded-[40px] max-w-6xl mx-auto my-12">
            <div class="max-w-4xl mx-auto">
                <div class="mb-12">
                    <h2 class="text-sm font-bold text-m3-primary uppercase tracking-widest mb-2">Research</h2>
                    <h3 class="text-4xl font-extrabold tracking-tight">Clinical Publications</h3>
                </div>
                <div id="publications-container" class="space-y-6"></div>
            </div>
        </section>

        <!-- EDUCATION & AWARDS SECTION -->
        <section id="education" class="py-24 px-6 max-w-4xl mx-auto">
            <div class="mb-12">
                <h2 class="text-sm font-bold text-m3-primary uppercase tracking-widest mb-2">Academic Background</h2>
                <h3 class="text-4xl font-extrabold tracking-tight">Education</h3>
            </div>
            <div id="education-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-24"></div>

            <!-- Awards Subsection -->
            <div class="mb-8">
                <h2 class="text-sm font-bold text-m3-tertiary uppercase tracking-widest mb-2">Honours & Achievements</h2>
                <h3 class="text-3xl font-extrabold tracking-tight">Awards</h3>
            </div>
            <div id="awards-container" class="max-w-4xl mx-auto space-y-4"></div>
        </section>
        
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
